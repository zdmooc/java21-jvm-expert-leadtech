server.port=8080

# Spring Boot 3.2+ : activation simple des virtual threads pour le traitement des requêtes HTTP
spring.threads.virtual.enabled=true

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.server.port=8080

# (optionnel) tags Micrometer
management.metrics.tags.application=springboot-lab
