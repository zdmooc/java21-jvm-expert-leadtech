apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-lab
  labels:
    app: quarkus-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-lab
  template:
    metadata:
      labels:
        app: quarkus-lab
      annotations:
        # Dynatrace (si injection sélective activée) :
        # oneagent.dynatrace.com/inject: "true"
        #
        # OpenTelemetry (optionnel) :
        # instrumentation.opentelemetry.io/inject-java: "true"
        #
        # Prometheus scrape (si vous n'utilisez pas ServiceMonitor) :
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: quarkus-lab-image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Exemple OTLP direct vers Dynatrace (si vous n'utilisez pas un collector)
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "https://{your-environment-id}.live.dynatrace.com/api/v2/otlp"
            # - name: OTEL_EXPORTER_OTLP_HEADERS
            #   valueFrom:
            #     secretKeyRef:
            #       name: dynatrace-otlp
            #       key: headers
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
